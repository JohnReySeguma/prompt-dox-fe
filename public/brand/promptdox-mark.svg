  <path d="M16.2 28.6c6.8-.9 15.6-1.1 29.6-.6l-.5 7.6c-12.6-.5-21.6-.3-29.4.6Z" fill="#F6E15A"/>
  <rect x="18.5" y="30.4" width="22" height="3.4" rx="1.7" fill="#161A22"/>
